name: Generate Contributor Issues

on:
  workflow_call:
    inputs:
      context:
        description: Focus area for generated issues
        type: string
        required: false
        default: general codebase improvements
      issue_count:
        description: Number of issues to generate (1-5)
        type: string
        required: false
        default: '3'
      model:
        description: Gemini model id
        type: string
        required: false
        default: gemini-3.8-flash
    secrets:
      GEMINI_API_KEY:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gemini SDK
        run: npm install @google/generative-ai

      - name: Generate and create issues
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_CONTEXT: ${{ inputs.context }}
          INPUT_COUNT: ${{ inputs.issue_count }}
          INPUT_MODEL: ${{ inputs.model }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { GoogleGenerativeAI } = require('@google/generative-ai');
            const fs = require('fs');
            const { execSync } = require('child_process');

            const focusArea = (process.env.INPUT_CONTEXT || 'general codebase improvements').trim();
            let issueCount = parseInt(process.env.INPUT_COUNT || '3', 10);
            if (!Number.isFinite(issueCount) || issueCount < 1) issueCount = 1;
            if (issueCount > 5) issueCount = 5;
            const modelId = (process.env.INPUT_MODEL || 'gemini-3.8-flash').trim();

            if (!process.env.GEMINI_API_KEY) {
              core.setFailed('GEMINI_API_KEY secret is missing');
              return;
            }

            const findCmd = [
              'find . -type f \\(',
              '-name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" -o',
              '-name "*.mjs" -o -name "*.cjs" -o -name "*.py" -o -name "*.go" -o',
              '-name "*.rs" -o -name "*.java" -o -name "*.kt" -o -name "*.rb" -o',
              '-name "*.php" -o -name "*.cs" -o -name "*.swift" -o -name "*.vue" -o',
              '-name "*.svelte" -o -name "*.md" -o -name "*.mdx" -o -name "*.yml" -o',
              '-name "*.yaml" -o -name "*.toml" -o -name "*.css" -o -name "*.scss" -o',
              '-name "*.html" -o -name "*.sh"',
              '\\) ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "*/dist/*"',
              '! -path "*/build/*" ! -path "*/.next/*" ! -path "*/vendor/*"',
              '! -path "*/__pycache__/*" ! -path "*/target/*" ! -path "*/coverage/*"',
              '| head -80'
            ].join(' ');

            let fileTree = '';
            try {
              fileTree = execSync(findCmd, { maxBuffer: 2 * 1024 * 1024 }).toString().trim();
            } catch (e) {
              fileTree = 'Could not read file tree';
            }

            const codeFiles = fileTree.split('\n').filter(Boolean).slice(0, 8);
            let sampleCode = '';
            for (const file of codeFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8').slice(0, 600);
                sampleCode += `\n\n// ${file}\n${content}`;
              } catch (e) {}
            }

            let readme = '';
            try {
              readme = fs.readFileSync('README.md', 'utf8').slice(0, 1500);
            } catch (e) {
              readme = 'No README found';
            }

            let openIssueTitles = [];
            try {
              const open = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              openIssueTitles = open
                .filter((i) => !i.pull_request)
                .map((i) => i.title)
                .slice(0, 80);
            } catch (e) {
              console.log(`Could not list open issues: ${e.message}`);
            }

            const existingBlock = openIssueTitles.length
              ? openIssueTitles.map((t) => `- ${t}`).join('\n')
              : '(none)';

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: modelId });

            const prompt = `
            You are a senior software engineer creating GitHub issues to attract new open-source contributors.

            Project README:
            ${readme}

            File structure (sample):
            ${fileTree}

            Sample code:
            ${sampleCode}

            Existing OPEN issue titles (do NOT duplicate or closely rephrase these):
            ${existingBlock}

            Focus area: ${focusArea}
            Number of issues to generate: ${issueCount}

            Generate exactly ${issueCount} NEW issues that are:
            - Small enough for a single PR by a first-time contributor
            - Specific to the files/docs above (name real paths when possible)
            - Actionable without private access, paid APIs, or secrets
            - Ordered easiest → hardest
            - Not duplicates of the open issues listed above

            Each issue body must include:
            - Background: why this matters for users/contributors
            - What to change: specific files and concrete steps
            - Acceptance criteria: checkbox list
            - Effort: Small, Medium, or Large

            Labels must only be from: ["bug", "enhancement", "documentation", "good first issue", "help wanted", "refactor"]
            Prefer including "good first issue" on the easiest issue and "help wanted" on at least one.

            Respond with ONLY a valid JSON object, no markdown fences:
            {
              "issues": [
                {
                  "title": "issue title",
                  "body": "## Background\\n\\n...\\n\\n## What to Change\\n\\n...\\n\\n## Acceptance Criteria\\n\\n- [ ] ...\\n\\n## Effort\\n\\nSmall",
                  "labels": ["good first issue"]
                }
              ]
            }
            `;

            const retryable = (e) => [429, 500, 502, 503, 504].includes(e.status);
            const maxAttempts = 6;
            let result;
            for (let attempt = 1; ; attempt++) {
              try {
                result = await model.generateContent(prompt);
                break;
              } catch (e) {
                if (!retryable(e) || attempt === maxAttempts) {
                  core.setFailed(`Gemini request failed after ${attempt} attempt(s): ${e.message}`);
                  return;
                }
                const delay = 5000 * 2 ** (attempt - 1);
                console.log(`Gemini returned ${e.status}, retrying in ${delay / 1000}s (attempt ${attempt}/${maxAttempts})`);
                await new Promise((resolve) => setTimeout(resolve, delay));
              }
            }

            const rawText = result.response.text().trim();
            let parsed;
            try {
              const cleaned = rawText.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '').trim();
              parsed = JSON.parse(cleaned);
            } catch (e) {
              core.setFailed(`Failed to parse Gemini response: ${rawText.slice(0, 800)}`);
              return;
            }

            if (!parsed.issues || !Array.isArray(parsed.issues)) {
              core.setFailed('Gemini response missing issues array');
              return;
            }

            const validLabels = new Set([
              'bug', 'enhancement', 'documentation', 'good first issue', 'help wanted', 'refactor'
            ]);
            const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const existingNorm = openIssueTitles.map(norm);

            let createdCount = 0;
            for (const issue of parsed.issues.slice(0, issueCount)) {
              const title = (issue.title || '').trim();
              if (!title) continue;
              const titleNorm = norm(title);
              const dup = existingNorm.some((t) => t === titleNorm || t.includes(titleNorm) || titleNorm.includes(t));
              if (dup) {
                console.log(`Skipping duplicate-ish title: ${title}`);
                continue;
              }

              const safeLabels = (issue.labels || []).filter((l) => validLabels.has(l));
              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: issue.body || '',
                  labels: safeLabels,
                });
                console.log(`Created issue #${created.data.number}: ${title}`);
                existingNorm.push(titleNorm);
                createdCount += 1;
              } catch (e) {
                console.error(`Failed to create issue "${title}": ${e.message}`);
              }
            }

            console.log(`Done. Created ${createdCount} issue(s).`);
